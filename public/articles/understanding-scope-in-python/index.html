        <h1>Understanding Scope in Python</h1>
        <p><em>2026-03-03 · Python, Fundamentals</em></p>

        <p>When you're starting out with Python, one of the first tricky concepts you'll run into is <strong>scope</strong> — the idea that a variable isn't always accessible from everywhere in your code.</p>

        <h2>The LEGB Rule</h2>
        <p>Python resolves variable names using the LEGB rule, checking these scopes in order:</p>
        <ol>
          <li><strong>Local</strong> — inside the current function.</li>
          <li><strong>Enclosing</strong> — in any enclosing (outer) function.</li>
          <li><strong>Global</strong> — at the top level of the module.</li>
          <li><strong>Built-in</strong> — Python's built-in names like <code>len</code> and <code>print</code>.</li>
        </ol>

        <h2>Local Scope</h2>
        <p>Variables created inside a function only exist inside that function:</p>
        <pre>def greet():
    message = "Hello!"
    print(message)

greet()         # prints "Hello!"
print(message)  # NameError</pre>

        <h2>Global Scope</h2>
        <p>Variables defined at the module level are accessible everywhere, but you need the <code>global</code> keyword to modify them inside a function:</p>
        <pre>count = 0

def increment():
    global count
    count += 1

increment()
print(count)  # 1</pre>

        <h2>Enclosing Scope</h2>
        <p>When you nest functions, the inner function can read variables from the outer function. To modify them, use <code>nonlocal</code>:</p>
        <pre>def outer():
    x = 10
    def inner():
        nonlocal x
        x += 5
    inner()
    print(x)  # 15

outer()</pre>

        <h2>Key Takeaways</h2>
        <ul>
          <li>Always think about <em>where</em> a variable is defined — that determines where it's visible.</li>
          <li>Avoid overusing <code>global</code>; it makes code harder to reason about.</li>
          <li>The LEGB rule is your mental model for how Python looks up names.</li>
        </ul>
